<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waybloss · 今日專屬花語 & 每日花園 ✨</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #f0fdf4 0%, #e6f4ea 45%, #e8effd 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #4a4a4a;
      overflow-x: hidden;
      position: relative;
    }

    /* 背景幸運草綠色光暈 */
    .bg-glow {
      position: fixed;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      opacity: 0.55;
      pointer-events: none;
    }
    .glow-1 { top: -80px; left: -80px; background: #bbf7d0; }
    .glow-2 { bottom: -80px; right: -80px; background: #bfdbfe; }

    /* 背景飄落幸運草容器 */
    .petals-container {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }
    .petal {
      position: absolute;
      top: -10%;
      font-size: 16px;
      user-select: none;
      animation: fall linear infinite;
    }
    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg) translateX(0); opacity: 0; }
      10% { opacity: 0.85; }
      90% { opacity: 0.85; }
      100% { transform: translateY(110vh) rotate(360deg) translateX(35px); opacity: 0; }
    }

    /* 3D 翻頁外層舞台 */
    .flip-scene {
      position: relative;
      z-index: 2;
      max-width: 390px;
      width: 100%;
      perspective: 1400px;
      animation: cardEntrance 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes cardEntrance {
      from { opacity: 0; transform: translateY(25px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .flip-card {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr;
      transform-style: preserve-3d;
      transition: transform 0.75s cubic-bezier(0.34, 1.4, 0.64, 1);
    }
    .flip-card.is-flipped {
      transform: rotateY(180deg);
    }

    /* 正反兩面共用卡片外框 */
    .card-face {
      grid-row-start: 1;
      grid-column-start: 1;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 32px;
      padding: 34px 24px 28px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 45px rgba(46, 125, 50, 0.14), 0 0 0 1px rgba(255, 255, 255, 0.9) inset;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-front {
      cursor: pointer;
    }

    .card-back {
      transform: rotateY(180deg);
    }

    /* 公司名稱醒目置頂 (粉紅色) */
    .brand-title {
      font-size: 22px;
      font-weight: 800;
      color: #ff4d6d;
      letter-spacing: 2.5px;
      margin-bottom: 6px;
      text-transform: uppercase;
      text-shadow: 0 2px 10px rgba(255, 77, 109, 0.2);
    }

    /* 頂部日期與編號列 */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      padding: 0 6px;
    }
    .date-badge {
      font-size: 12.5px;
      font-weight: 600;
      color: #2e7d32;
      background: rgba(220, 252, 231, 0.85);
      padding: 5px 12px;
      border-radius: 12px;
      letter-spacing: 1px;
    }
    .day-count {
      font-size: 12px;
      font-weight: 600;
      color: #558b2f;
      letter-spacing: 0.5px;
    }

    /* 圖示光環 (幸運綠主題) */
    .emoji-wrapper {
      position: relative;
      width: 108px;
      height: 108px;
      margin: 0 auto 16px;
      background: linear-gradient(145deg, #f0fdf4 0%, #dcfce7 100%);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 10px 25px rgba(46, 125, 50, 0.15), inset 0 2px 8px rgba(255, 255, 255, 0.9);
    }
    .emoji-wrapper::after {
      content: "";
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 1.5px dashed rgba(74, 222, 128, 0.6);
      animation: spinSlow 20s linear infinite;
    }
    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .emoji {
      font-size: 54px;
      display: inline-block;
      animation: float 3.2s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    /* 花名與花語標籤 */
    .flower-name {
      font-size: 27px;
      font-weight: 800;
      background: linear-gradient(45deg, #1b5e20, #2e7d32);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
      letter-spacing: 1.5px;
    }
    .meaning-tag {
      display: inline-block;
      background: linear-gradient(90deg, #dcfce7 0%, #bbf7d0 100%);
      color: #14532d;
      font-size: 13.5px;
      font-weight: 600;
      padding: 5px 16px;
      border-radius: 20px;
      margin-bottom: 18px;
      box-shadow: 0 3px 10px rgba(74, 222, 128, 0.2);
    }

    /* 祝福語區塊 */
    .message-box {
      background: rgba(240, 253, 244, 0.85);
      border-radius: 20px;
      padding: 16px 15px;
      border: 1px solid rgba(187, 247, 208, 0.85);
      margin-bottom: 16px;
    }
    .message {
      font-size: 14.5px;
      line-height: 1.65;
      color: #334155;
      margin-bottom: 10px;
    }
    .lucky-tip {
      font-size: 12.5px;
      color: #276749;
      font-weight: 600;
      padding-top: 10px;
      border-top: 1px dashed #bbf7d0;
    }

    /* 按鈕群組 */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .action-btn {
      color: white;
      border: none;
      border-radius: 15px;
      padding: 11px 18px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .garden-btn {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      box-shadow: 0 6px 16px rgba(16, 185, 129, 0.28);
    }
    .share-btn {
      background: linear-gradient(135deg, #2e7d32 0%, #1b5e20 100%);
      box-shadow: 0 6px 16px rgba(46, 125, 50, 0.22);
    }
    .ig-btn {
      background: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      box-shadow: 0 6px 16px rgba(220, 39, 67, 0.22);
    }
    .back-btn {
      background: #f1f5f9;
      color: #475569;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
    }
    .action-btn:active {
      transform: scale(0.96);
    }

    .footer-note {
      margin-top: 14px;
      font-size: 11.5px;
      color: #64748b;
      letter-spacing: 0.5px;
    }

    /* ================= 背面：每日澆花小遊戲樣式 ================= */
    .garden-header {
      margin-bottom: 12px;
    }
    .garden-subtitle {
      font-size: 13px;
      color: #558b2f;
      font-weight: 600;
    }
    .pot-stage {
      position: relative;
      width: 155px;
      height: 155px;
      margin: 10px auto 16px;
      background: radial-gradient(circle, #ffffff 30%, #dcfce7 100%);
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 12px 28px rgba(46, 125, 50, 0.16), inset 0 2px 10px rgba(255, 255, 255, 0.9);
      border: 2px solid #bbf7d0;
    }
    .plant-emoji {
      font-size: 74px;
      line-height: 1.1;
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      animation: sway 3.5s ease-in-out infinite;
    }
    @keyframes sway {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(3deg); }
    }
    .plant-pop {
      transform: scale(1.28) !important;
    }
    .stage-badge {
      font-size: 12px;
      font-weight: 700;
      color: #15803d;
      background: #dcfce7;
      padding: 4px 12px;
      border-radius: 12px;
      margin-top: 6px;
    }

    /* 成長進度條 */
    .progress-container {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 18px;
      padding: 14px 16px;
      margin-bottom: 16px;
    }
    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 700;
      color: #166534;
      margin-bottom: 8px;
    }
    .progress-bar-bg {
      width: 100%;
      height: 12px;
      background: #dcfce7;
      border-radius: 10px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      width: 10%;
      background: linear-gradient(90deg, #4ade80, #16a34a);
      border-radius: 10px;
      transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .garden-desc {
      font-size: 13px;
      color: #475569;
      margin-top: 10px;
      line-height: 1.5;
    }

    .water-btn {
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      box-shadow: 0 8px 20px rgba(2, 132, 199, 0.28);
      font-size: 15px;
      padding: 13px 20px;
    }
    .water-btn.watered {
      background: linear-gradient(135deg, #94a3b8 0%, #64748b 100%);
      box-shadow: none;
      cursor: default;
    }

    /* 點擊與澆水飄出特效 */
    .pop-clover {
      position: fixed;
      pointer-events: none;
      font-size: 22px;
      z-index: 99;
      animation: popUp 1s ease-out forwards;
    }
    @keyframes popUp {
      0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
      100% { transform: translate(-50%, -120px) scale(1.3); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- 背景光暈與飄落幸運草 -->
  <div class="bg-glow glow-1"></div>
  <div class="bg-glow glow-2"></div>
  <div class="petals-container" id="petals"></div>

  <!-- 3D 翻頁舞台 -->
  <div class="flip-scene">
    <div class="flip-card" id="flip-card">

      <!-- ==================== 正面：今日專屬花語 ==================== -->
      <div class="card-face card-front" id="flower-card" title="輕觸卡片有幸運小驚喜">
        <div>
          <div class="brand-title">Waybloss</div>

          <div class="top-bar">
            <div class="date-badge" id="today-date">2026 . 01 . 01</div>
            <div class="day-count" id="day-number">No. 001 / 365</div>
          </div>

          <div class="emoji-wrapper">
            <div class="emoji" id="flower-emoji">🍀</div>
          </div>

          <div class="flower-name" id="flower-name">載入幸運中...</div>
          <div class="meaning-tag" id="flower-meaning"></div>

          <div class="message-box">
            <div class="message" id="flower-message"></div>
            <div class="lucky-tip" id="lucky-tip"></div>
          </div>
        </div>

        <div>
          <div class="btn-group">
            <button class="action-btn garden-btn" onclick="flipCard(event)">
              <span>🌱 前往我的專屬花園（每日澆花）</span>
            </button>
            <button class="action-btn share-btn" id="copy-btn" onclick="copyFlower(event)">
              <span>✨ 複製今日專屬花語</span>
            </button>
            <a href="https://www.instagram.com/waybloss?mdxt=bnZhN3ZrenQxd3dr" target="_blank" class="action-btn ig-btn" onclick="event.stopPropagation()">

          <div class="footer-note">輕觸卡片收集幸運草 · 每天都有新驚喜</div>

      <div class="card-face card-back">
        <div>
          <div class="brand-title">Waybloss</div>
          <div class="garden-header">
            <div class="garden-subtitle">🌿 我的專屬幸運花圃 · 每日養成 🌿</div>
          </div>

          <div class="pot-stage" id="pot-stage">

            <div class="stage-badge" id="stage-name">階段 1：神秘種子</div>
          </div>

          <div class="progress-container">
            <div class="progress-info">
              <span>累積澆水：<strong id="water-days">0</strong> 天</span>

          </div>
        </div>

        <div>
          <div class="btn-group">
            <button class="action-btn water-btn" id="water-btn" onclick="waterPlant(event)">
              <span>💧 今日澆水 (+1 成長值)</span>
            </button>
            <button class="action-btn back-btn" onclick="flipCard(event)">

          </div>
          <div class="footer-note">小提示：每天只能澆水一次，明天記得再來喔！</div>
        </div>
      </div>

    </div>
  </div>

  <script>

    const petalsContainer = document.getElementById('petals');
    for (let i = 0; i < 15; i++) {
      const petal = document.createElement('div');

      { emoji: "🌺", name: "木槿花", meaning: "溫柔的堅持", desc: "每天進步一點點就夠了，時間會帶你去到你想去的地方。" },
      { emoji: "💐", name: "桔梗花", meaning: "永恆不變的愛", desc: "有些人、有些夢想，只要你一直放在心上，就一定會實現。" },
      { emoji: "🌿", name: "尤加利葉", meaning: "恩賜與深呼吸", desc: "給自己五分鐘的放空時間，聽首喜歡的歌，享受當下的寧靜。" },
      { emoji: "🌸", name: "梨花", meaning: "純真與安慰", desc: "你已經做得很好了，別給自己太大壓力，今晚早點睡個好覺。" },
      { emoji: "🌼", name: "蒲公英", meaning: "無法停留的愛與自由", desc: "願你像蒲公英一樣自由自在，勇敢飛向屬於你的廣闊天空。" },
      { emoji: "🌷", name: "黃鬱金香", meaning: "開朗與珍貴的友誼", desc: "有空的話傳個訊息給好朋友吧，一句簡單的問候就能溫暖彼此。" },
      { emoji: "🏵️", name: "大麗花", meaning: "華麗與優雅的自信", desc: "抬頭挺胸，自信的你無論走到哪裡都是最亮眼的風景。" },
      { emoji: "🌺", name: "杜鵑花", meaning: "永遠屬於你的節制與愛", desc: "好運正在排隊向你走來，請保持微笑準備簽收喔！" },
      { emoji: "🪷", name: "睡蓮", meaning: "潔淨與純真之心", desc: "心若向陽，無畏悲傷。今天也要做個快樂又自在的人。" },
      { emoji: "🌹", name: "黃玫瑰", meaning: "純潔的友誼與美好祝福", desc: "感謝生命中所有的相遇，願你今天收穫滿滿的善意與驚喜。" }
    ];

    // 3. 12 種每日幸運加持語
    const blessings = [
      "🍀 Waybloss 幸運色：草地綠｜適合做一件讓自己微笑的小事",
      "🍀 Waybloss 幸運色：櫻花粉｜保持好心情，今天會有好事發生",
      "🍀 Waybloss 幸運色：天空藍｜放寬心胸，事情會比想像中順利",
      "🍀 Waybloss 幸運色：薄荷綠｜給自己泡杯好茶，享受愜意時光",
      "🍀 Waybloss 幸運色：奶油白｜今天很適合犒賞自己喜歡的小點心",
      "🍀 Waybloss 幸運色：薰衣草紫｜直覺很準的一天，勇敢去嘗試吧",
      "🍀 Waybloss 幸運色：蜜桃橘｜充滿活力的一天，積極迎向新挑戰",
      "🍀 Waybloss 幸運色：珍珠銀｜靜心思考，你會找到心領神會的答案",
      "🍀 Waybloss 幸運色：森林綠｜多看綠色植物，讓靈魂與眼睛一起放鬆",
      "🍀 Waybloss 幸運色：海鹽藍｜把煩惱拋在腦後，專注當下的美好",
      "🍀 Waybloss 幸運色：玫瑰金｜你的溫柔與善良，今天會被溫柔以待",
      "🍀 Waybloss 幸運色：香草黃｜保持好奇心，今天會收穫意外的小驚喜"
    ];

    // 4. 個人專屬種子碼與日期運算
    let userSeed = localStorage.getItem('waybloss_flower_seed');
    if (!userSeed) {
      userSeed = Math.floor(Math.random() * 999999) + 1;
      localStorage.setItem('waybloss_flower_seed', userSeed);
    } else {
      userSeed = parseInt(userSeed, 10);
    }

    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const day = String(now.getDate()).padStart(2, '0');
    const todayStr = `${year}-${month}-${day}`;
    document.getElementById('today-date').textContent = `${year} . ${month} . ${day}`;

    const startOfYear = new Date(year, 0, 0);
    const dayOfYear = Math.floor((now - startOfYear) / (1000 * 60 * 60 * 24));
    document.getElementById('day-number').textContent = `No. ${String(dayOfYear).padStart(3, '0')} / 365`;

    const flowerIndex = ((dayOfYear * 7) + userSeed) % flowers.length;
    const blessingIndex = ((dayOfYear * 5) + Math.floor(userSeed / 3)) % blessings.length;

    const todayFlower = flowers[flowerIndex];
    const todayBlessing = blessings[blessingIndex];

    document.getElementById('flower-emoji').textContent = todayFlower.emoji;
    document.getElementById('flower-name').textContent = todayFlower.name;
    document.getElementById('flower-meaning').textContent = `花語：${todayFlower.meaning}`;
    document.getElementById('flower-message').textContent = todayFlower.desc;
    document.getElementById('lucky-tip').textContent = todayBlessing;

    // 5. 3D 翻頁控制
    function flipCard(event) {
      if (event) event.stopPropagation();
      document.getElementById('flip-card').classList.toggle('is-flipped');
    }

    // 6. 點擊正面卡片飄出幸運草特效
    document.getElementById('flower-card').addEventListener('click', function(e) {
      if (e.target.closest('.action-btn')) return;
      spawnParticles(e.clientX, e.clientY, ['🍀', '✨', '💚', '🌸', '🌿'], 1);
    });

    function spawnParticles(x, y, icons, count) {
      for (let i = 0; i < count; i++) {
        const el = document.createElement('div');
        el.className = 'pop-clover';
        el.textContent = icons[Math.floor(Math.random() * icons.length)];
        const offsetX = (Math.random() - 0.5) * 60;
        const offsetY = (Math.random() - 0.5) * 30;
        el.style.left = (x + offsetX) + 'px';
        el.style.top = (y + offsetY) + 'px';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 1000);
      }
    }

    // 7. 一鍵複製花語功能
    function copyFlower(event) {
      event.stopPropagation();
      const shareText = `【Waybloss · ${year}.${month}.${day} 專屬幸運花語】\n${todayFlower.emoji} ${todayFlower.name}（花語：${todayFlower.meaning}）\n「${todayFlower.desc}」\n${todayBlessing}\n🔗 追蹤 IG：https://www.instagram.com/waybloss`;
      
      navigator.clipboard.writeText(shareText).then(() => {
        const btn = document.getElementById('copy-btn');
        btn.innerHTML = '<span>✅ 已複製專屬幸運！</span>';
        setTimeout(() => {
          btn.innerHTML = '<span>✨ 複製今日專屬花語</span>';
        }, 2200);
      });
    }

    // 8. 每日澆花小遊戲邏輯
    let waterCount = parseInt(localStorage.getItem('waybloss_water_count') || '0', 10);
    let lastWaterDate = localStorage.getItem('waybloss_last_water_date') || '';

    // 根據個人專屬種子決定最終盛開的花朵品種（每人養出來的花不同！）
    const bloomFlowers = [
      { emoji: "🍀", title: "階段 5：奇蹟四葉幸運草" },
      { emoji: "🌸", title: "階段 5：浪漫粉櫻盛開" },
      { emoji: "🌻", title: "階段 5：燦爛陽光向日葵" },
      { emoji: "🌹", title: "階段 5：永恆之愛紅玫瑰" },
      { emoji: "🌷", title: "階段 5：優雅祝福鬱金香" }
    ];
    const myBloom = bloomFlowers[userSeed % bloomFlowers.length];

    function updateGardenUI() {
      document.getElementById('water-days').textContent = waterCount;
      const plantEmoji = document.getElementById('plant-emoji');
      const stageName = document.getElementById('stage-name');
      const nextGoal = document.getElementById('next-goal');
      const progressFill = document.getElementById('progress-fill');
      const gardenDesc = document.getElementById('garden-desc');
      const waterBtn = document.getElementById('water-btn');

      // 5 個成長階段判斷 (滿級為 10 天)
      if (waterCount === 0) {
        plantEmoji.textContent = "🌰";
        stageName.textContent = "階段 1：沉睡的種子";
        nextGoal.textContent = "距離發芽還差 1 天";
        progressFill.style.width = "8%";
      } else if (waterCount <= 2) {
        plantEmoji.textContent = "🌱";
        stageName.textContent = "階段 2：破土小嫩芽";
        nextGoal.textContent = `距離長葉還差 ${3 - waterCount} 天`;
        progressFill.style.width = (waterCount * 10 + 10) + "%";
        gardenDesc.textContent = "太棒了！小種子感受到你的愛心，已經冒出嫩綠的新芽囉！";
      } else if (waterCount <= 5) {
        plantEmoji.textContent = "🌿";
        stageName.textContent = "階段 3：茂盛幸運枝葉";
        nextGoal.textContent = `距離含苞還差 ${6 - waterCount} 天`;
        progressFill.style.width = (waterCount * 10) + "%";
        gardenDesc.textContent = "葉片越來越翠綠茂盛了！繼續每天澆水，很快就要長出花苞了。";
      } else if (waterCount <= 9) {
        plantEmoji.textContent = "🌷";
        stageName.textContent = "階段 4：含苞待放";
        nextGoal.textContent = `距離盛開還差 ${10 - waterCount} 天`;
        progressFill.style.width = (waterCount * 10) + "%";
        gardenDesc.textContent = "哇！已經結出飽滿的花苞了，再堅持澆水幾天就會完全盛開！";
      } else {
        plantEmoji.textContent = myBloom.emoji;
        stageName.textContent = myBloom.title;
        nextGoal.textContent = "🎉 已完全盛開！";
        progressFill.style.width = "100%";
        gardenDesc.textContent = "恭喜你用心灌溉了 10 天以上！你的專屬幸運之花已經璀璨盛開，繼續澆水可以維持它的活力喔！";
      }

      // 檢查今天是否已經澆過水
      if (lastWaterDate === todayStr) {
        waterBtn.classList.add('watered');
        waterBtn.innerHTML = '<span>✅ 今日已澆水 · 明天再來吧</span>';
      }
    }

    function waterPlant(event) {
      event.stopPropagation();
      if (lastWaterDate === todayStr) return;

      waterCount += 1;
      lastWaterDate = todayStr;
      localStorage.setItem('waybloss_water_count', waterCount);
      localStorage.setItem('waybloss_last_water_date', lastWaterDate);

      // 植物彈跳放大 + 噴出水滴與幸運草特效
      const plantEmoji = document.getElementById('plant-emoji');
      plantEmoji.classList.add('plant-pop');
      setTimeout(() => plantEmoji.classList.remove('plant-pop'), 500);

      const rect = plantEmoji.getBoundingClientRect();
      spawnParticles(rect.left + rect.width / 2, rect.top + rect.height / 2, ['💧', '💦', '🍀', '✨'], 8);

      updateGardenUI();
    }

    // 初始化花園狀態
    updateGardenUI();
  </script>

</body>
</html>
