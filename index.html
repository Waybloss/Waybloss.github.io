<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今日專屬花語 ✨</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #ffeef2 0%, #f8e8ee 45%, #e8effd 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #4a4a4a;
      overflow-x: hidden;
      position: relative;
    }

    /* 背景夢幻光暈 */
    .bg-glow {
      position: fixed;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      opacity: 0.65;
      pointer-events: none;
    }
    .glow-1 { top: -80px; left: -80px; background: #ffc2d1; }
    .glow-2 { bottom: -80px; right: -80px; background: #bde0fe; }

    /* 飄落花瓣容器 */
    .petals-container {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }
    .petal {
      position: absolute;
      top: -10%;
      color: rgba(255, 143, 163, 0.45);
      font-size: 16px;
      user-select: none;
      animation: fall linear infinite;
    }
    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg) translateX(0); opacity: 0; }
      10% { opacity: 0.8; }
      90% { opacity: 0.8; }
      100% { transform: translateY(110vh) rotate(360deg) translateX(30px); opacity: 0; }
    }

    /* 主卡片設計 */
    .card {
      position: relative;
      z-index: 2;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 32px;
      padding: 38px 26px 32px;
      max-width: 390px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 45px rgba(214, 90, 116, 0.16), 0 0 0 1px rgba(255, 255, 255, 0.9) inset;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      animation: cardEntrance 0.9s cubic-bezier(0.22, 1, 0.36, 1);
      cursor: pointer;
    }
    .card:active {
      transform: scale(0.97);
    }
    @keyframes cardEntrance {
      from { opacity: 0; transform: translateY(25px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* 頂部日期與編號列 */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
      padding: 0 6px;
    }
    .date-badge {
      font-size: 13px;
      font-weight: 600;
      color: #8c6d75;
      background: rgba(255, 229, 236, 0.7);
      padding: 5px 12px;
      border-radius: 12px;
      letter-spacing: 1px;
    }
    .day-count {
      font-size: 12px;
      font-weight: 600;
      color: #b5838d;
      letter-spacing: 0.5px;
    }

    /* 花朵圖示光環 */
    .emoji-wrapper {
      position: relative;
      width: 118px;
      height: 118px;
      margin: 0 auto 20px;
      background: linear-gradient(145deg, #fff0f3 0%, #ffe0e9 100%);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 10px 25px rgba(255, 143, 163, 0.25), inset 0 2px 8px rgba(255, 255, 255, 0.9);
    }
    .emoji-wrapper::after {
      content: "";
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 1.5px dashed rgba(255, 143, 163, 0.45);
      animation: spinSlow 20s linear infinite;
    }
    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .emoji {
      font-size: 60px;
      display: inline-block;
      animation: float 3.2s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    /* 花名與花語標籤 */
    .flower-name {
      font-size: 29px;
      font-weight: 800;
      background: linear-gradient(45deg, #c9184a, #ff4d6d);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
      letter-spacing: 1.5px;
    }
    .meaning-tag {
      display: inline-block;
      background: linear-gradient(90deg, #ffccd5 0%, #ffe5ec 100%);
      color: #800f2f;
      font-size: 14px;
      font-weight: 600;
      padding: 6px 18px;
      border-radius: 20px;
      margin-bottom: 24px;
      box-shadow: 0 3px 10px rgba(255, 179, 193, 0.3);
    }

    /* 祝福語區塊 */
    .message-box {
      background: rgba(255, 248, 250, 0.8);
      border-radius: 20px;
      padding: 20px 18px;
      border: 1px solid rgba(255, 204, 213, 0.6);
      margin-bottom: 22px;
    }
    .message {
      font-size: 15.5px;
      line-height: 1.75;
      color: #4f4a4c;
      margin-bottom: 14px;
    }
    .lucky-tip {
      font-size: 13px;
      color: #b56576;
      font-weight: 600;
      padding-top: 12px;
      border-top: 1px dashed #ffb3c1;
    }

    /* 分享按鈕 */
    .share-btn {
      background: linear-gradient(135deg, #ff758f 0%, #ff4d6d 100%);
      color: white;
      border: none;
      border-radius: 16px;
      padding: 12px 24px;
      font-size: 14.5px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 8px 20px rgba(255, 77, 109, 0.28);
      transition: all 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }
    .share-btn:active {
      transform: scale(0.96);
      box-shadow: 0 4px 10px rgba(255, 77, 109, 0.2);
    }

    .footer-note {
      margin-top: 18px;
      font-size: 12px;
      color: #9e8a8f;
      letter-spacing: 0.5px;
    }

    /* 點擊飄出愛心特效 */
    .pop-heart {
      position: fixed;
      pointer-events: none;
      font-size: 20px;
      z-index: 99;
      animation: popUp 1s ease-out forwards;
    }
    @keyframes popUp {
      0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
      100% { transform: translate(-50%, -120px) scale(1.3); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- 背景光暈與飄落花瓣 -->
  <div class="bg-glow glow-1"></div>
  <div class="bg-glow glow-2"></div>
  <div class="petals-container" id="petals"></div>

  <!-- 主卡片 -->
  <div class="card" id="flower-card" title="點我看看小驚喜">
    <div class="top-bar">
      <div class="date-badge" id="today-date">2026 . 01 . 01</div>
      <div class="day-count" id="day-number">No. 001 / 365</div>
    </div>

    <div class="emoji-wrapper">
      <div class="emoji" id="flower-emoji">🌸</div>
    </div>

    <div class="flower-name" id="flower-name">感應花語中...</div>
    <div class="meaning-tag" id="flower-meaning"></div>

    <div class="message-box">
      <div class="message" id="flower-message"></div>
      <div class="lucky-tip" id="lucky-tip"></div>
    </div>

    <button class="share-btn" id="copy-btn" onclick="copyFlower(event)">
      <span>✨ 複製今日專屬花語</span>
    </button>

    <div class="footer-note">輕觸卡片有小驚喜 · 明日再來感應新花語</div>
  </div>

  <script>
    // 1. 產生背景飄落花瓣
    const petalsContainer = document.getElementById('petals');
    const petalSymbols = ['🌸', ' petals', '✨', '💮'];
    for (let i = 0; i < 14; i++) {
      const petal = document.createElement('div');
      petal.className = 'petal';
      petal.textContent = i % 3 === 0 ? '✨' : '🌸';
      petal.style.left = Math.random() * 100 + 'vw';
      petal.style.animationDuration = (Math.random() * 6 + 7) + 's';
      petal.style.animationDelay = (Math.random() * 5) + 's';
      petal.style.fontSize = (Math.random() * 8 + 12) + 'px';
      petalsContainer.appendChild(petal);
    }

    // 2. 36 種精選花卉資料庫
    const flowers = [
      { emoji: "🌹", name: "紅玫瑰", meaning: "熱烈的愛與真心", desc: "願你今天被滿滿的愛意與好運包圍，勇敢做自己喜歡的事。" },
      { emoji: "🌻", name: "向日葵", meaning: "沉默的愛與陽光", desc: "無論今天天氣如何，你永遠是自己世界裡最耀眼的小太陽。" },
      { emoji: "🌷", name: "鬱金香", meaning: "永恆的祝福與體貼", desc: "希望你今天一切順利，再忙也要記得按時吃飯、好好休息。" },
      { emoji: "🌼", name: "小雛菊", meaning: "純真與藏在心底的喜歡", desc: "平凡的日子裡，因為有你的微笑而變得特別溫柔。" },
      { emoji: "🌸", name: "櫻花", meaning: "幸福與希望的降臨", desc: "願你今天的每一個瞬間，都像春風拂面一樣輕盈快樂。" },
      { emoji: "🪻", name: "薰衣草", meaning: "平靜與等待奇蹟", desc: "如果今天覺得有點累了，深呼吸一下，美好的事情正在路上。" },
      { emoji: "💐", name: "滿天星", meaning: "甘願做配角的溫柔", desc: "在屬於你的舞台上盡情發光吧，總有人在默默為你喝采。" },
      { emoji: "🌺", name: "扶桑花", meaning: "新鮮的熱情與活力", desc: "今天也要充滿元氣地迎接挑戰，好運正悄悄向你靠近。" },
      { emoji: "🪷", name: "蓮花", meaning: "清淨與內心的安寧", desc: "願所有的煩惱與焦慮都遠離你，今天只留下純粹的開心。" },
      { emoji: "🌿", name: "迷迭香", meaning: "留住美好的回憶", desc: "珍惜眼前的每一刻，今天也會成為你未來最珍貴的回憶。" },
      { emoji: "🏵️", name: "金盞花", meaning: "溫暖的關懷與盼望", desc: "即使遇到小小的陰天也別擔心，陽光很快就會穿過雲層。" },
      { emoji: "💮", name: "白山茶", meaning: "純潔無瑕的理想", desc: "保持你那份獨特的真誠與善良，世界會溫柔地回報你。" },
      { emoji: "🥀", name: "香檳玫瑰", meaning: "只鍾情於你的溫柔", desc: "生活需要一點儀式感，今天不妨給自己買點喜歡的小東西吧。" },
      { emoji: "🍀", name: "四葉草", meaning: "意想不到的幸運", desc: "恭喜你抽中幸運草！今天會有意想不到的小確幸發生在你身上。" },
      { emoji: "🌾", name: "麥穗", meaning: "豐收與踏實的努力", desc: "你過去流下的每一滴汗水，都會在未來的某一天開花結果。" },
      { emoji: "🌵", name: "仙人掌花", meaning: "堅強與外冷內熱", desc: "你比自己想像的還要堅強，但也別忘了適時向身邊的人撒個嬌。" },
      { emoji: "🍁", name: "紅楓", meaning: "沉穩與歲月靜好", desc: "放慢腳步感受生活，每一個階段的你都散發著獨特的魅力。" },
      { emoji: "🍃", name: "薄荷葉", meaning: "清爽與重獲新生", desc: "把昨天的不愉快通通清零，今天又是充滿希望的全新一天！" },
      { emoji: "🎋", name: "翠竹", meaning: "節節高升與坦蕩", desc: "願你的學業、事業與生活都像竹子一樣，穩穩地節節高升。" },
      { emoji: "🌱", name: "新芽", meaning: "無限的潛力與希望", desc: "每一個微小的開始都蘊藏著巨大的能量，放心大膽地往前走吧。" },
      { emoji: "🪻", name: "風信子", meaning: "重燃生命的喜悅", desc: "把心裡的窗戶打開，讓溫暖的陽光和新鮮的好心情照進來。" },
      { emoji: "🌼", name: "洋甘菊", meaning: "逆境中的能量與治癒", desc: "不管遇到什麼困難，你都有足夠的智慧與韌性去化解它。" },
      { emoji: "🌸", name: "桃花", meaning: "好人緣與甜蜜機遇", desc: "今天你的魅力值滿分！不僅好人緣爆棚，還可能遇見懂你的人。" },
      { emoji: "🌷", name: "粉鬱金香", meaning: "美人與幸福的熱愛", desc: "記得多誇獎自己幾句，你今天看起來真的特別棒！" },
      { emoji: "🌹", name: "白玫瑰", meaning: "純潔與天真無邪", desc: "願你永遠保有對世界的好奇心，眼裡有光，心中有愛。" },
      { emoji: "🌻", name: "非洲菊", meaning: "神秘與永遠快樂", desc: "笑一個吧！你的笑容是這個世界上最具有感染力的魔法。" },
      { emoji: "🌺", name: "木槿花", meaning: "溫柔的堅持", desc: "每天進步一點點就夠了，時間會帶你去到你想去的地方。" },
      { emoji: "💐", name: "桔梗花", meaning: "永恆不變的愛", desc: "有些人、有些夢想，只要你一直放在心上，就一定會實現。" },
      { emoji: "🌿", name: "尤加利葉", meaning: "恩賜與深呼吸", desc: "給自己五分鐘的放空時間，聽首喜歡的歌，享受當下的寧靜。" },
      { emoji: "🌸", name: "梨花", meaning: "純真與安慰", desc: "你已經做得很好了，別給自己太大壓力，今晚早點睡個好覺。" },
      { emoji: "🌼", name: "蒲公英", meaning: "無法停留的愛與自由", desc: "願你像蒲公英一樣自由自在，勇敢飛向屬於你的廣闊天空。" },
      { emoji: "🌷", name: "黃鬱金香", meaning: "開朗與珍貴的友誼", desc: "有空的話傳個訊息給好朋友吧，一句簡單的問候就能溫暖彼此。" },
      { emoji: "🏵️", name: "大麗花", meaning: "華麗與優雅的自信", desc: "抬頭挺胸，自信的你無論走到哪裡都是最亮眼的風景。" },
      { emoji: "🌺", name: "杜鵑花", meaning: "永遠屬於你的節制與愛", desc: "好運正在排隊向你走來，請保持微笑準備簽收喔！" },
      { emoji: "🪷", name: "睡蓮", meaning: "潔淨與純真之心", desc: "心若向陽，無畏悲傷。今天也要做個快樂又自在的人。" },
      { emoji: "🌹", name: "黃玫瑰", meaning: "純潔的友誼與美好祝福", desc: "感謝生命中所有的相遇，願你今天收穫滿滿的善意與驚喜。" }
    ];

    // 3. 12 種每日幸運加持語
    const blessings = [
      "💫 今日幸運色：暖陽金｜適合做一件讓自己開心的小事",
      "💫 今日幸運色：櫻花粉｜微笑會為你帶來意想不到的好運",
      "💫 今日幸運色：天空藍｜保持平常心，事情會比想像中順利",
      "💫 今日幸運色：薄荷綠｜適合聽一首輕快的歌，放鬆緊繃的神經",
      "💫 今日幸運色：奶油白｜今天很適合喝一杯喜歡的飲料犒賞自己",
      "💫 今日幸運色：薰衣草紫｜直覺很準的一天，相信你的第一選擇",
      "💫 今日幸運色：蜜桃橘｜熱情與活力滿滿，適合推進一直想做的事",
      "💫 今日幸運色：珍珠銀｜靜下心來思考，你會找到困擾已久的答案",
      "💫 今日幸運色：森林綠｜多看看窗外的風景，讓眼睛和心情都休息一下",
      "💫 今日幸運色：海鹽藍｜把煩惱交給微風，今天只專注於當下的快樂",
      "💫 今日幸運色：玫瑰金｜你的貼心與善良，今天會被身邊的人看見",
      "💫 今日幸運色：香草黃｜保持好奇心，今天可能會學到有趣的新事物"
    ];

    // 4. 個人專屬種子碼計算（確保每台手機不同，且同一天固定）
    let userSeed = localStorage.getItem('nfc_flower_user_seed');
    if (!userSeed) {
      userSeed = Math.floor(Math.random() * 999999) + 1;
      localStorage.setItem('nfc_flower_user_seed', userSeed);
    } else {
      userSeed = parseInt(userSeed, 10);
    }

    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const day = String(now.getDate()).padStart(2, '0');
    document.getElementById('today-date').textContent = `${year} . ${month} . ${day}`;

    // 計算一年中的第幾天
    const startOfYear = new Date(year, 0, 0);
    const dayOfYear = Math.floor((now - startOfYear) / (1000 * 60 * 60 * 24));
    document.getElementById('day-number').textContent = `No. ${String(dayOfYear).padStart(3, '0')} / 365`;

    const flowerIndex = ((dayOfYear * 7) + userSeed) % flowers.length;
    const blessingIndex = ((dayOfYear * 5) + Math.floor(userSeed / 3)) % blessings.length;

    const todayFlower = flowers[flowerIndex];
    const todayBlessing = blessings[blessingIndex];

    document.getElementById('flower-emoji').textContent = todayFlower.emoji;
    document.getElementById('flower-name').textContent = todayFlower.name;
    document.getElementById('flower-meaning').textContent = `花語：${todayFlower.meaning}`;
    document.getElementById('flower-message').textContent = todayFlower.desc;
    document.getElementById('lucky-tip').textContent = todayBlessing;

    // 5. 點擊卡片飄出小愛心特效
    document.getElementById('flower-card').addEventListener('click', function(e) {
      if (e.target.closest('#copy-btn')) return;
      const heart = document.createElement('div');
      heart.className = 'pop-heart';
      const icons = ['💖', '🌸', '✨', '🌷', '💕'];
      heart.textContent = icons[Math.floor(Math.random() * icons.length)];
      heart.style.left = e.clientX + 'px';
      heart.style.top = e.clientY + 'px';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 1000);
    });

    // 6. 一鍵複製花語功能
    function copyFlower(event) {
      event.stopPropagation();
      const shareText = `【${year}.${month}.${day} 今日專屬花語】\n${todayFlower.emoji} ${todayFlower.name}（花語：${todayFlower.meaning}）\n「${todayFlower.desc}」\n${todayBlessing}`;
      
      navigator.clipboard.writeText(shareText).then(() => {
        const btn = document.getElementById('copy-btn');
        btn.innerHTML = '<span>✅ 已複製！快去貼上分享吧</span>';
        btn.style.background = 'linear-gradient(135deg, #40c057 0%, #2b8a3e 100%)';
        setTimeout(() => {
          btn.innerHTML = '<span>✨ 複製今日專屬花語</span>';
          btn.style.background = 'linear-gradient(135deg, #ff758f 0%, #ff4d6d 100%)';
        }, 2200);
      });
    }
  </script>

</body>
</html>
